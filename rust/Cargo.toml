[package]
name = "azure-functions-nodejs-worker-rust"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
build = "build.rs"
exclude = ["node_modules", "sample/node_modules"]

[workspace]
members = [".", "opentelemetry"]

[dependencies]
anyhow = "1"
azure-functions-opentelemetry-rust = { path = "opentelemetry" }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dunce = "1"
futures-util = { version = "0.3", features = ["sink"] }
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
tonic = { version = "0.14", features = ["tls-native-roots"] }
tonic-prost = "0.14"
tracing-subscriber = "0.3"

[build-dependencies]
tonic-prost-build = "0.14"
