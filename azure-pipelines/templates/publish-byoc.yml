jobs:
  - job: PublishBYOCAssets
    displayName: "Upload BYOC assets to GitHub release"
    steps:
      - checkout: none
      - task: DownloadPipelineArtifact@2
        displayName: "Download worker assets from the NuGet source build"
        inputs:
          buildType: current
          artifactName: drop
          targetPath: "$(Pipeline.Workspace)/node-worker-release"
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem -LiteralPath $env:ASSET_DIRECTORY -Filter 'azure-functions-nodejs-worker-*.tar.gz' -File)
          if ($archives.Count -ne 1) {
              throw "Expected exactly one Node.js worker archive; found $($archives.Count)."
          }
          $archive = $archives[0]
          if ($archive.Name -notmatch '^azure-functions-nodejs-worker-(?<version>.+)\.tar\.gz$') {
              throw "Unexpected worker archive name: $($archive.Name)"
          }
          $version = $Matches.version
          $checksum = Get-Item -LiteralPath "$($archive.FullName).sha256"
          $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content -LiteralPath $checksum.FullName -Raw).TrimEnd() -cne "$hash  $($archive.Name)") {
              throw "Checksum does not match $($archive.Name)."
          }
          $assets = @($archive, $checksum)
          $headers = @{
              "Accept" = "application/vnd.github+json"
              "Authorization" = "Bearer $env:GITHUB_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          $tag = [System.Uri]::EscapeDataString("v$version")
          $release = Invoke-RestMethod -Headers $headers `
              -Uri "https://api.github.com/repos/Azure/azure-functions-nodejs-worker/releases/tags/$tag"
          foreach ($asset in $assets) {
              if ($release.assets.name -contains $asset.Name) {
                  throw "BYOC asset '$($asset.Name)' already exists on release v$version. Existing assets are not overwritten; remove conflicting BYOC assets before retrying."
              }
          }
          $uploadUrl = $release.upload_url -replace '\{\?name,label\}$', ''
          foreach ($asset in $assets) {
              $assetUrl = '{0}?name={1}' -f $uploadUrl, [System.Uri]::EscapeDataString($asset.Name)
              Write-Host "Uploading $($asset.Name)"
              Invoke-RestMethod -Headers $headers -Method Post -Uri $assetUrl `
                  -ContentType 'application/octet-stream' -InFile $asset.FullName | Out-Null
          }
        displayName: "Attach Node.js archive and checksum"
        env:
          GITHUB_TOKEN: $(GithubPat)
          ASSET_DIRECTORY: $(Pipeline.Workspace)/node-worker-release
